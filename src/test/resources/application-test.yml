spring:
  datasource:
    url: jdbc:h2:mem:booking-concurrency;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:booking-concurrency-schema.sql

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: airlineReservation.infra.entity
  configuration:
    map-underscore-to-camel-case: true
