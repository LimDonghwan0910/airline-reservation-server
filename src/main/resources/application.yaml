spring:
  datasource:
    # db설정
    url: jdbc:postgresql://localhost:5433/airline_reservation
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}  # 도커 컨테이너 생성 시 설정한 비밀번호 입력
    driver-class-name: org.postgresql.Driver

mybatis:
  # XML 매퍼 파일들의 위치 지정(resources/mapper/ 폴더 안의 모든 XML)
  mapper-locations: classpath:mapper/**/*.xml
  # 패키지명을 생략할 수 있도록 기본 패키지를 지정
  type-aliases-package: com.example.airlinereservation.model # 본인의 엔티티/DTO 패키지 경로로 수정
  configuration:
    map-underscore-to-camel-case: true