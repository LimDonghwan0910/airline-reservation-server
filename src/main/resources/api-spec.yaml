components:
  schemas:
    CreateAccountRequest:
      type: object
      required:
        - userName
        - email
        - password
        - phoneNumber
        - birthDate
      properties:
        userName:
          type: string
        email:
          type: string
        password:
          type: string
        phoneNumber:
          type: string
        birthDate:
          type: string
          format: date

    CreateAccountResponse:
      type: object
      properties:
        success:
          type: boolean

    DeleteAccountRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string

    DeleteAccountResponse:
      type: object
      properties:
        success:
          type: boolean

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        userId:
          type: integer
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        accessToken:
          type: string


    CreateAircraftRequest:
      type: object
      required:
        - aircraftId
        - aircraftName
        - rowCount
        - columnCount
      properties:
        aircraftId:
          type: string
          example: SEO123
        aircraftName:
          type: string
          example: Boeing-777
        rowCount:
          type: integer
        columnCount:
          type: integer

    CreateAircraftResponse:
      type: object
      properties:
        success:
          type: boolean

    SearchAircraftRequest:
      type: object
      properties:
        aircraftId:
          type: string
          example: SEO123
        aircraftName:
          type: string
          example: Boeing-777

    SearchAircraftResponse:
      type: object
      properties:
        aircraftList:
          type: array
          items:
            type: object
            properties:
              aircraftId:
                type: string
                example: SEO123
              aircraftName:
                type: string
                example: Boeing-777
              rowCount:
                type: integer
              columnCount:
                type: integer

    UpdateAircraftRequest:
      type: object
      properties:
        aircraftId:
          type: string
          example: SEO123
        aircraftName:
          type: string
          example: Boeing-777
        rowCount:
          type: integer
        columnCount:
          type: integer

    UpdateAircraftResponse:
      type: object
      properties:
        success:
          type: boolean

    DeleteAircraftRequest:
      type: object
      required:
        - aircraftId
      properties:
        aircraftId:
          type: string
          example: SEO123

    DeleteAircraftResponse:
      type: object
      properties:
        success:
          type: boolean

    GetAirportsRequest:
      type: object
      properties:
        aircraftId:
          type: string
          example: SEO123

    GetAirportsResponse:
        type: object
        properties:
          airportList:
            type: array
            items:
              type: object
              properties:
                airportId:
                  type: string
                airportNameKo:
                  type: string
                airportNameEn:
                  type: string
                country:
                  type: string
                city:
                  type: string

    CreateScheduleTemplateRequest:
      type: object
      required:
        - aircraftId
        - departureAirportId
        - arrivalAirportId
        - startDate
        - endDate
        - departureTime
        - arrivalTime
        - price
        - daysOfWeek
      properties:
        aircraftId:
          type: string
        departureAirportId:
          type: string
        arrivalAirportId:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        departureTime:
          type: string
          format: time
        arrivalTime:
          type: string
          format: time
        price:
          type: integer
        daysOfWeek:
          type: object
          properties:
            mon:
              type: boolean
            tue:
              type: boolean
            wed:
              type: boolean
            thu:
              type: boolean
            fri:
              type: boolean
            sat:
              type: boolean
            sun:
              type: boolean

    CreateScheduleTemplateResponse:
      type: object
      properties:
        success:
          type: boolean

    SearchScheduleTemplateRequest:
      type: object
      properties:
        aircraftId:
          type: string

    SearchScheduleTemplateResponse:
      type: object
      properties:
        scheduleTemplateList:
          type: array
          items:
            type: object
            properties:
              templateId:
                type: integer
              aircraftId:
                type: string
              departureAirportId:
                type: string
              arrivalAirportId:
                type: string
              startDate:
                type: string
                format: date
              endDate:
                type: string
                format: date
              departureTime:
                type: string
                format: time
              arrivalTime:
                type: string
                format: time
              price:
                type: integer
              daysOfWeek:
                type: object
                properties:
                  mon:
                    type: boolean
                  tue:
                    type: boolean
                  wed:
                    type: boolean
                  thu:
                    type: boolean
                  fri:
                    type: boolean
                  sat:
                    type: boolean
                  sun:
                    type: boolean

    SearchScheduleRequest:
      type: object
      properties:
        aircraftId:
          type: string
        departureAirportId:
          type: string
        arrivalAirportId:
          type: string
        departureDate:
          type: string
          format: date

    SearchScheduleResponse:
      type: object
      properties:
        scheduleList:
          type: array
          items:
            type: object
            properties:
              scheduleId:
                type: integer
              templateId:
                type: integer
              aircraftId:
                type: string
              departureAirportId:
                type: string
              arrivalAirportId:
                type: string
              departureDatetime:
                type: string
                format: date-time
              arrivalDatetime:
                type: string
                format: date-time
              status:
                type: string

    DeleteScheduleTemplateRequest:
      type: object
      properties:
        templateId:
          type: integer

    DeleteScheduleTemplateResponse:
      type: object
      properties:
        success:
          type: boolean

    DeleteScheduleRequest:
      type: object
      properties:
        scheduleId:
          type: integer

    DeleteScheduleResponse:
      type: object
      properties:
        success:
          type: boolean

    CreateBookingRequest:
      type: object
      properties:
